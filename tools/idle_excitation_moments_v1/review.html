<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>怠速 · 颗粒激励对照</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:#eef1f3;color:#182e39;font:16px/1.65 system-ui,sans-serif}main{max-width:660px;margin:auto;background:white;padding:26px;border-radius:14px}h1{font-size:24px;line-height:1.4;margin:0 0 12px}p{font-size:14px;color:#51636c}label{display:block;margin:15px 0 5px}select,audio{width:100%;font:inherit}select{padding:10px;border:1px solid #bccad0;border-radius:7px;background:white;color:inherit}audio{margin-top:22px}#status{min-height:1.7em}.note{font-size:13px}</style>
<main><h1>怠速 · 颗粒激励对照</h1>
<p>先比较“原细谱基准”和“新颗粒 · 50%”，再与原录音核对。留意沙声是否减轻、机械颗粒是否更自然，以及有没有额外爆点。</p>
<label for="mode">声音</label><select id="mode"><option value="000" selected>原细谱基准 · 无调制</option><option value="050">新颗粒 · 50%</option><option value="100">新颗粒 · 100%</option><option value="fast">前轮 · 主声线带动细节50%</option><option value="reference">原录音 · F2尾排（3秒）</option></select>
<label for="bus">监听</label><select id="bus"><option value="mix">完整声音</option><option value="detail">只听细节</option></select>
<label for="seed">生成组</label><select id="seed"><option>149921</option><option>277139</option><option>381611</option></select>
<audio id="player" controls preload="metadata"></audio><p id="status" role="status">准备中…</p>
<p>本轮从素材提取细节的集中程度，生成新的随机颗粒。主声线、共振频谱和左右关系保持，声音持续生成；没有循环原片或房间处理。</p>
<p>全部使用同一增益 __GAIN__，没有逐条补偿响度。生成声音12秒，原录音3秒。请暂停其他发声窗口。</p>
<p class="note">50%／100%是实验量，不能理解成真实发动机还原比例。此页只比较固定怠速细节，尚未替换驾驶Demo。</p></main>
<script>
const files=__FILES__,player=document.querySelector('#player'),mode=document.querySelector('#mode'),bus=document.querySelector('#bus'),seed=document.querySelector('#seed'),status=document.querySelector('#status'),cache=new Map();let revision=0;
async function update(){const serial=++revision,at=player.currentTime||0,playing=!player.paused;player.pause();const ref=mode.value==='reference';seed.disabled=ref;bus.disabled=ref;if(ref)bus.value='mix';status.textContent='准备中…';try{const key=ref?'reference_mix':mode.value+'_'+seed.value+'_'+bus.value,name=files[key];if(!cache.has(name))cache.set(name,fetch(name).then(r=>{if(!r.ok)throw Error(r.status);return r.blob();}).then(b=>URL.createObjectURL(b)));const url=await cache.get(name);if(serial!==revision)return;player.addEventListener('loadedmetadata',()=>{if(serial!==revision)return;player.currentTime=Math.min(at,Math.max(0,player.duration-.02));status.textContent=mode.selectedOptions[0].text+' · '+bus.selectedOptions[0].text;if(playing)player.play().catch(()=>{});},{once:true});player.src=url;player.load();}catch(e){if(serial===revision)status.textContent='读取失败，请刷新。'}}
for(const el of [mode,bus,seed])el.addEventListener('change',update);window.addEventListener('pagehide',()=>{for(const p of cache.values())p.then(u=>URL.revokeObjectURL(u)).catch(()=>{});});update();
</script></html>
