<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>怠速 · 细节关联对照</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:#eef1f3;color:#182e39;font:16px/1.65 system-ui,sans-serif}main{max-width:660px;margin:auto;background:white;padding:26px;border-radius:14px}h1{font-size:24px;line-height:1.4;margin:0 0 12px}p{font-size:14px;color:#51636c}label{display:block;margin:15px 0 5px}select,audio{width:100%;font:inherit}select{padding:10px;border:1px solid #bccad0;border-radius:7px;background:white;color:inherit}audio{margin-top:22px}#status{min-height:1.7em}.note{font-size:13px}</style>
<main><h1>怠速 · 细节关联对照</h1>
<p>先比较“旧细谱基准”和“新候选”，再核对原录音。留意均匀沙声、机械颗粒和额外颤动；也可以只听细节。</p>
<label for="mode">声音</label><select id="mode"><option value="static" selected>旧细谱基准</option><option value="sparse">旧独立颗粒对照</option><option value="post">新候选 · 主声线带动细节</option><option value="reference_training">原录音 · F2尾排 6–9秒</option><option value="reference_check">原录音 · F2尾排 9–12秒</option></select>
<label for="bus">监听</label><select id="bus"><option value="mix">完整声音</option><option value="detail">只听细节</option></select>
<label for="seed">生成组</label><select id="seed"><option>149921</option><option>277139</option><option>381611</option></select>
<audio id="player" controls preload="metadata"></audio><p id="status" role="status">准备中…</p>
<p>新候选让不同频段随主声线起伏，降低随机颗粒的集中程度。主声线和共振频谱保持，没有循环原录音或新增房间处理。</p>
<p>全部使用同一增益 __GAIN__；生成声音12秒，原声每段3秒。请先暂停其他发声窗口。</p>
<p class="note">本页是固定怠速实验，尚未替换驾驶Demo。原录音近单声道，生成组是不同随机细节，不代表不同车辆或转速。</p></main>
<script>
const files=__FILES__,player=document.querySelector('#player'),mode=document.querySelector('#mode'),bus=document.querySelector('#bus'),seed=document.querySelector('#seed'),status=document.querySelector('#status'),cache=new Map();let revision=0;
async function update(){const serial=++revision,at=player.currentTime||0,playing=!player.paused;player.pause();const ref=mode.value.startsWith('reference_');seed.disabled=ref;bus.disabled=ref;if(ref)bus.value='mix';status.textContent='准备中…';try{const key=ref?mode.value:mode.value+'_'+seed.value+'_'+bus.value,name=files[key];if(!cache.has(name))cache.set(name,fetch(name).then(r=>{if(!r.ok)throw Error(r.status);return r.blob();}).then(b=>URL.createObjectURL(b)));const url=await cache.get(name);if(serial!==revision)return;player.addEventListener('loadedmetadata',()=>{if(serial!==revision)return;player.currentTime=Math.min(at,Math.max(0,player.duration-.02));status.textContent=mode.selectedOptions[0].text+' · '+bus.selectedOptions[0].text;if(playing)player.play().catch(()=>{});},{once:true});player.src=url;player.load();}catch(e){if(serial===revision)status.textContent='读取失败，请刷新。'}}
for(const el of [mode,bus,seed])el.addEventListener('change',update);window.addEventListener('pagehide',()=>{for(const p of cache.values())p.then(u=>URL.revokeObjectURL(u)).catch(()=>{});});update();
</script></html>
