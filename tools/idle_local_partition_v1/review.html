<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>怠速 · 主声线与细节配比</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:#edf0f1;color:#1c343b;font:16px/1.65 system-ui,sans-serif}main{max-width:650px;margin:auto;background:#fff;padding:28px;border-radius:14px}h1{font-size:25px;margin:0 0 12px}p{color:#556970;font-size:14px}label{display:block;margin:14px 0 5px}select,audio{width:100%;font:inherit}select{padding:10px;background:white;border:1px solid #bdcacf;border-radius:7px;color:inherit}.row{display:flex;gap:14px}.row>div{flex:1;min-width:0}audio{margin-top:22px}#status{min-height:1.6em}a{color:#175e72}</style>
<main><h1>怠速 · 主声线与细节配比</h1><p>先比较前两项，听发动机主声线是否更清楚、缓慢嗡动是否减轻；再听第三项，判断力度起伏是否自然。请先暂停其他发声窗口。</p>
<label for="mode">声音</label><select id="mode"><option value="0.0">上轮 · 重新提取低频细节</option><option value="0.5">新版 · 主声线与细节重新配比</option><option value="1.0">新配比＋力度变化</option><option value="reference_train">原录音 · F2尾排6–9秒</option><option value="reference_check">原录音 · F2尾排9–12秒</option></select>
<div class="row"><div><label for="bus">监听</label><select id="bus"><option value="mix">完整声音</option><option value="main">只听主声线</option></select></div><div><label for="seed">生成组</label><select id="seed"><option>149921</option><option>277139</option><option>381611</option></select></div></div>
<audio id="player" controls preload="metadata"></audio><p id="status" role="status">准备中…</p>
<p>新版按素材重新设置三条主声线的幅度，并按剩余声音的功率计算两层低频细节。原相位变化和高频细节保留；第三项加入已提取的完整力度变化。</p>
<p>生成声每组24秒，参考录音各3秒，全部同增益__GAIN__；没有逐条补响度、加宽或房间处理。这是离线候选，尚未替换正式C Demo，完整怠速质感仍需听评。</p>
<p><a href="/references/analysis/idle_phase_amplitude_v1/residual_review1/index.html">上轮对照</a> · <a href="/research/current_demo_v1/index.html">保留的系统Demo</a></p>
</main><script>
const files=__FILES__,player=document.querySelector('#player'),mode=document.querySelector('#mode'),bus=document.querySelector('#bus'),seed=document.querySelector('#seed'),status=document.querySelector('#status'),cache=new Map();let serial=0,wasReference=false;
async function update(){const revision=++serial,playing=!player.paused;player.pause();const reference=mode.value.startsWith('reference_');const at=reference!==wasReference?0:(player.currentTime||0);wasReference=reference;bus.disabled=seed.disabled=reference;const key=reference?mode.value:mode.value+'_'+seed.value+'_'+bus.value;status.textContent='准备中…';try{const name=files[key];if(!cache.has(name))cache.set(name,fetch(name).then(r=>{if(!r.ok)throw Error(r.status);return r.blob()}).then(b=>URL.createObjectURL(b)));const url=await cache.get(name);if(revision!==serial)return;player.addEventListener('loadedmetadata',()=>{if(revision!==serial)return;player.currentTime=Math.min(at,Math.max(0,player.duration-.05));status.textContent=mode.selectedOptions[0].text+(reference?'':' · '+bus.selectedOptions[0].text);if(playing)player.play().catch(()=>{});},{once:true});player.src=url;player.load();}catch(e){if(revision===serial)status.textContent='读取失败，请刷新。'}}
for(const e of [mode,bus,seed])e.addEventListener('change',update);window.addEventListener('pagehide',()=>{for(const v of cache.values())v.then(u=>URL.revokeObjectURL(u)).catch(()=>{});});update();
</script></html>
