<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>怠速 · 声线与细节</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0f1;color:#183039;font:16px/1.65 system-ui,sans-serif;padding:28px 16px}main{max-width:670px;margin:auto;background:#fff;padding:28px;border-radius:14px}h1{font-size:25px;margin:0 0 12px}p{font-size:14px;color:#53656b}label{display:block;margin:14px 0 5px}select,audio{width:100%;font:inherit}select{padding:10px;border:1px solid #bcc9ce;border-radius:7px;background:white;color:inherit}audio{margin:22px 0 4px}.row{display:flex;gap:14px}.row>div{flex:1}#status{min-height:1.6em}details{margin-top:20px}summary{cursor:pointer;color:#53656b}a{color:#175e72}</style>
<main><h1>怠速 · 声线与细节</h1>
<p>先比较“旧细谱”和“新怠速候选”，再核对原录音。留意机械质感、均匀沙声，以及是否出现额外颤动。请先暂停其他发声窗口。</p>
<label for="mode">声音</label><select id="mode"><option value="static">旧细谱 · 基准</option><option value="post">前轮候选 · 细节随声线变化</option><option value="relation_full">新怠速候选 · 声线与细节共同变化</option><option value="reference_training">原录音 · F2尾排 6–9秒</option><option value="reference_check">原录音 · F2尾排 9–12秒</option></select>
<div class="row"><div><label for="bus">监听</label><select id="bus"><option value="mix">完整声音</option><option value="detail">只听细节</option></select></div><div><label for="seed">生成组</label><select id="seed"><option>149921</option><option>277139</option><option>381611</option></select></div></div>
<label for="length">时长</label><select id="length"><option value="short">24秒对照</option><option value="long">3分钟持续声 · 第一组完整混音</option></select>
<audio id="player" controls preload="metadata"></audio><p id="status" role="status">准备中…</p>
<p>新候选让主要低阶声线保持从录音学到的关联，并带动高频细节。每次变化由统计模型重新生成，没有循环录音或新增房间效果。</p>
<p>全部同增益 __GAIN__，未逐条补响度。原声每段3秒；生成组代表不同随机细节。这是固定怠速试听，尚未替换驾驶Demo。</p>
<details><summary>进一步对照</summary><label for="diagnostic">只改变细节联动，保留旧主声线</label><input type="checkbox" id="diagnostic"> 启用诊断对照<p>在“新怠速候选”下生效。旧配方也使用本轮相同的随机源，方便听出配方变化；不是旧文件逐样本回放。原录音近单声道，本页没有额外制造宽度。</p><p><a href="/references/analysis/idle_post_audio_v1/review1/index.html">保留的前轮完整试听</a></p></details>
</main><script>
const files=__FILES__,player=document.querySelector('#player'),mode=document.querySelector('#mode'),bus=document.querySelector('#bus'),seed=document.querySelector('#seed'),length=document.querySelector('#length'),diagnostic=document.querySelector('#diagnostic'),status=document.querySelector('#status'),cache=new Map();let revision=0,lastReference=false;
async function update(){const serial=++revision,playing=!player.paused;player.pause();const ref=mode.value.startsWith('reference_'),long=length.value==='long'&&!ref;let at=ref!==lastReference?0:(player.currentTime||0);lastReference=ref;seed.disabled=ref||long;bus.disabled=ref||long;length.disabled=ref;diagnostic.disabled=ref||mode.value!=='relation_full';const chosen=mode.value==='relation_full'&&diagnostic.checked?'relation_q':mode.value;const key=ref?mode.value:chosen+'_'+(long?'149921':seed.value)+'_'+(long?'mix':bus.value)+'_'+(long?'long':'short');status.textContent='准备中…';try{const name=files[key];if(!name)throw Error('missing clip');if(!cache.has(name))cache.set(name,fetch(name).then(r=>{if(!r.ok)throw Error(r.status);return r.blob();}).then(b=>URL.createObjectURL(b)));const url=await cache.get(name);if(serial!==revision)return;player.addEventListener('loadedmetadata',()=>{if(serial!==revision)return;player.currentTime=Math.min(at,Math.max(0,player.duration-.05));status.textContent=mode.selectedOptions[0].text+(ref?'':(' · '+(long?'3分钟完整声音':bus.selectedOptions[0].text)))+(chosen==='relation_q'?' · 诊断对照':'');if(playing)player.play().catch(()=>{});},{once:true});player.src=url;player.load();}catch(e){if(serial===revision)status.textContent='读取失败，请刷新。'}}
for(const el of [mode,bus,seed,length,diagnostic])el.addEventListener('change',update);window.addEventListener('pagehide',()=>{for(const p of cache.values())p.then(u=>URL.revokeObjectURL(u)).catch(()=>{});});update();
</script></html>
