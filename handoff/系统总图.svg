<text x="743" y="875" class="copy">风声／低频噪声感；保留对照与四种录音视角</text>
<text x="56" y="912" class="sub">下一步（未接入驾驶）：提取发动机同步低频 → 留出验证相位和包络 → 等低频 RMS 听评 → 新版本适配工况。</text>
