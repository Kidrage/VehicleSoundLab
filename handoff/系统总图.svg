<text x="408" y="773" class="file">tools/ · Python 与音频分析脚本</text>
<text x="408" y="794" class="copy">声线、幅度 / 相位和统计变化</text>
<text x="408" y="815" class="copy">模型预载；音频线程不读素材</text>
<rect x="726" y="710" width="476" height="82" rx="12" fill="#fff" stroke="#b7ccbb"/>
