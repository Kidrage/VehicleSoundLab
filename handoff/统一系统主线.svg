<text x="44" y="821" class="sub">听觉角色：声线与纹理属于 DNA，不宣称从混合录音完成物理进排气分离。</text>
<text x="44" y="851" class="sub">当前跨工况混合为可调工程配方；各车型全 RPM / 负载标定与独立事件音色仍需逐项听评。</text>
